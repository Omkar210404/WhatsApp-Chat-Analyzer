# Privacy settings. Both matter, please do not remove them.

[browser]
# Streamlit sends anonymous usage statistics by default. Turned off so the app
# makes no outside request at all.
gatherUsageStats = false

[server]
# Listen on this machine only, so other devices on the network cannot open the app.
address = "localhost"

[client]
toolbarMode = "minimal"

[theme]
# Fixed dark theme. The chart colours in app.py are chosen for this background,
# so change both together. No web fonts: they would be an outside request.
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d1014"
secondaryBackgroundColor = "#151a21"
textColor = "#e6e9ee"
borderColor = "#262d37"
